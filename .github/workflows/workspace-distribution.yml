name: Workspace Distribution

on:
  push:
    branches: [feat/workspace-distribution, test/workspace-linux-notices]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth xdotool dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          bun install --frozen-lockfile
          bun run build
          go mod verify
      - name: Build Linux packages
        run: go run ./cmd/mygo build -platform linux/amd64 apps/workspace/cmd/mygo
      - name: Verify distribution files
        working-directory: apps/workspace/cmd/mygo/dist/linux-amd64
        run: |
          test -s mygo-workspace_0.1.0_amd64.deb
          test -s mygo-workspace-0.1.0-linux-amd64.tar.gz
          test -s install.sh
          dpkg-deb --info mygo-workspace_0.1.0_amd64.deb
          dpkg-deb --contents mygo-workspace_0.1.0_amd64.deb
          tar -tzf mygo-workspace-0.1.0-linux-amd64.tar.gz
          notice=../../resources/linux/copyright
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          dpkg-deb -x mygo-workspace_0.1.0_amd64.deb "$tmp"
          cmp "$notice" "$tmp/usr/share/doc/mygo-workspace/copyright"
          tar -xOzf mygo-workspace-0.1.0-linux-amd64.tar.gz copyright | cmp "$notice" -
          go version -m ./mygo-workspace > GO-BUILD-INFO.txt
          cat GO-BUILD-INFO.txt
          sha256sum mygo-workspace_0.1.0_amd64.deb mygo-workspace-0.1.0-linux-amd64.tar.gz install.sh GO-BUILD-INFO.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify installed user application
        run: |
          bash -n apps/workspace/smoke-install-linux.sh
          xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-install-linux.sh apps/workspace/cmd/mygo/dist/linux-amd64
      - name: Test Debian package writer
        run: go test ./cmd/mygo -run '^TestDebCopyright$' -count=1
      - name: Verify apt-installed application
        if: github.ref == 'refs/heads/test/workspace-linux-notices'
        run: |
          deb=apps/workspace/cmd/mygo/dist/linux-amd64/mygo-workspace_0.1.0_amd64.deb
          test "$(dpkg-query -W -f='${db:Status-Status}' mygo-workspace 2>/dev/null || true)" != installed
          sudo apt-get install -y --no-install-recommends "./$deb"
          trap 'sudo apt-get remove -y mygo-workspace' EXIT
          xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-install-linux.sh "${deb%/*}" --deb-installed
          sudo apt-get remove -y mygo-workspace
          trap - EXIT
          test ! -e /usr/bin/mygo-workspace && test ! -L /usr/bin/mygo-workspace
          test ! -e /usr/share/doc/mygo-workspace/copyright
          echo 'PASS: apt removal cleaned up the launcher and copyright'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feat/workspace-distribution'
        with:
          name: mygo-workspace-0.1.0-linux-amd64
          path: |
            apps/workspace/cmd/mygo/dist/linux-amd64/*.deb
            apps/workspace/cmd/mygo/dist/linux-amd64/*.tar.gz
            apps/workspace/cmd/mygo/dist/linux-amd64/install.sh
            apps/workspace/cmd/mygo/dist/linux-amd64/SHA256SUMS
            apps/workspace/cmd/mygo/dist/linux-amd64/GO-BUILD-INFO.txt
          if-no-files-found: error
