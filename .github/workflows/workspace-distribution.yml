name: Workspace Distribution

on:
  push:
    branches: [main, test/workspace-linux-notices, test/workspace-cloud-acceptance, test/workspace-installed-search]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/workspace-distribution.yml'
      - 'apps/workspace/cmd/mygo/search*.go'
      - 'apps/workspace/probe-installed-search-linux.py'
      - 'apps/workspace/smoke-install-linux.sh'
      - 'apps/workspace/smoke-search-xerj-linux.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      MYGO_VERIFY_INSTALLED_SEARCH: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/test/workspace-installed-search' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth xdotool dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          if [[ "$MYGO_VERIFY_INSTALLED_SEARCH" == true ]]; then
            sudo apt-get install -y --no-install-recommends at-spi2-core python3-pyatspi
          fi
          bun install --frozen-lockfile
          bun run build
          go mod verify
      - name: Build Linux packages
        run: go run ./cmd/mygo build -platform linux/amd64 apps/workspace/cmd/mygo
      - name: Verify distribution files
        working-directory: apps/workspace/cmd/mygo/dist/linux-amd64
        run: |
          test -s mygo-workspace_0.1.0_amd64.deb
          test -s mygo-workspace-0.1.0-linux-amd64.tar.gz
          test -s install.sh
          dpkg-deb --info mygo-workspace_0.1.0_amd64.deb
          dpkg-deb --contents mygo-workspace_0.1.0_amd64.deb
          tar -tzf mygo-workspace-0.1.0-linux-amd64.tar.gz
          notice=../../resources/linux/copyright
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          dpkg-deb -x mygo-workspace_0.1.0_amd64.deb "$tmp"
          cmp "$notice" "$tmp/usr/share/doc/mygo-workspace/copyright"
          tar -xOzf mygo-workspace-0.1.0-linux-amd64.tar.gz copyright | cmp "$notice" -
          tar -xOzf mygo-workspace-0.1.0-linux-amd64.tar.gz libghostty-vt.so > "$tmp/ghostty-tar.so"
          python3 ../../../../check-linux-native-notices.py "$tmp/opt/mygo-workspace/libghostty-vt.so" "$tmp/ghostty-tar.so"
          # Distinguish dynamic dependencies from the pinned static components.
          readelf -d "$tmp/opt/mygo-workspace/libghostty-vt.so" | grep '(NEEDED)'
          # A positive marker is evidence of retention, not a full asset inventory.
          python3 -c 'from pathlib import Path; data = Path("mygo-workspace").read_bytes(); print("Terminal theme name markers:", [name for name in ("Belafonte Day", "Belafonte Night") if name.encode() in data])'
          go version -m ./mygo-workspace > GO-BUILD-INFO.txt
          cat GO-BUILD-INFO.txt
          # A changed binary inventory needs a new notice review.
          awk '$1 == "dep" { print $2, $3, $4 }' GO-BUILD-INFO.txt | LC_ALL=C sort > "$tmp/go-modules"
          diff -u ../../../../linux-go-notices.modules "$tmp/go-modules"
          sha256sum mygo-workspace_0.1.0_amd64.deb mygo-workspace-0.1.0-linux-amd64.tar.gz install.sh GO-BUILD-INFO.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify installed user application
        run: |
          bash -n apps/workspace/smoke-install-linux.sh
          if [[ "$MYGO_VERIFY_INSTALLED_SEARCH" == true ]]; then
            NO_AT_BRIDGE=0 xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-search-xerj-linux.sh bash apps/workspace/smoke-install-linux.sh apps/workspace/cmd/mygo/dist/linux-amd64
          else
            xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-install-linux.sh apps/workspace/cmd/mygo/dist/linux-amd64
          fi
      - name: Test Debian package writer
        run: go test ./cmd/mygo -run '^TestDebCopyright$' -count=1
      - name: Verify apt-installed application
        run: |
          deb=apps/workspace/cmd/mygo/dist/linux-amd64/mygo-workspace_0.1.0_amd64.deb
          test "$(dpkg-query -W -f='${db:Status-Status}' mygo-workspace 2>/dev/null || true)" != installed
          sudo apt-get install -y --no-install-recommends "./$deb"
          trap 'sudo apt-get remove -y mygo-workspace' EXIT
          if [[ "$MYGO_VERIFY_INSTALLED_SEARCH" == true ]]; then
            MYGO_XERJ_SEARCH_KEYBOARD=1 NO_AT_BRIDGE=0 xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-search-xerj-linux.sh bash apps/workspace/smoke-install-linux.sh "${deb%/*}" --deb-installed
          else
            xvfb-run -a dbus-run-session -- bash apps/workspace/smoke-install-linux.sh "${deb%/*}" --deb-installed
          fi
          sudo apt-get remove -y mygo-workspace
          trap - EXIT
          test ! -e /usr/bin/mygo-workspace && test ! -L /usr/bin/mygo-workspace
          test ! -e /usr/share/doc/mygo-workspace/copyright
          echo 'PASS: apt removal cleaned up the launcher and copyright'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mygo-workspace-0.1.0-linux-amd64
          path: |
            apps/workspace/cmd/mygo/dist/linux-amd64/*.deb
            apps/workspace/cmd/mygo/dist/linux-amd64/*.tar.gz
            apps/workspace/cmd/mygo/dist/linux-amd64/install.sh
            apps/workspace/cmd/mygo/dist/linux-amd64/SHA256SUMS
            apps/workspace/cmd/mygo/dist/linux-amd64/GO-BUILD-INFO.txt
          if-no-files-found: error
